name: CI

# Both distributions are built and exercised on every PR, because a release is
# tag-triggered and both registries are immutable: a build that only breaks at
# publish time breaks at the exact moment nothing can be taken back.
on:
  push:
    branches: [main]
  pull_request:
  # A daily run on main: the compiled core is a default dependency now. The core is pinned
  # exactly, so a new core release never reaches this workflow; what the daily run catches is a
  # change of the interpreters, the runner images or PyPI's wheels for the pinned core.
  schedule:
    - cron: "17 5 * * *"
  # The release workflow calls this file, so a tag cannot publish a commit
  # these jobs would have failed.
  workflow_call:

# Least privilege: no job here writes to the repository.
permissions:
  contents: read

env:
  # The version of uv the wheel and install jobs use, the one dag-core's workflows pin.
  UV_VERSION: "0.13.6"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Manifest version parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # npm and PyPI drifted once (npm 0.1.0 against PyPI 0.1.1) because nothing
      # tied the two manifests together and one tag ships both. Catching it here
      # means the release workflow's identical check never has to fire.
      - name: Assert pyproject.toml and package.json agree
        run: |
          py=$(grep -m1 '^version = ' python/pyproject.toml | cut -d'"' -f2)
          js=$(node -p "require('./npm/package.json').version")
          echo "pyproject=$py  package.json=$js"
          [ "$py" = "$js" ] || { echo "::error::version drift: pyproject $py vs package.json $js"; exit 1; }

  registry:
    name: Registry compiles to the shipped schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This is what makes the repo self-contained. Without it the committed
      # component-schema.json is an opaque blob nobody can reproduce from
      # source, and `registry/` beside it is decoration -- editable, never
      # compiled, silently divergent from what actually ships. Pydantic is a
      # DEV dependency only: it is what the authoring format is written in, and
      # it is precisely what must never reach the wheel.
      - name: Install pydantic (authoring-only dependency)
        run: python -m pip install --quiet pydantic

      - name: Assert both distributions carry the compiled registry
        run: python -m registry.generate --check

  python:
    name: Python distribution
    runs-on: ubuntu-latest
    # The gate runs the suite twice (compiled backend, then pure Python).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The gate the package declares for itself: ruff, format, pyright strict
      # and the suite at 100% branch coverage. CI used to build and smoke-test
      # the wheel without running a single unit test.
      - name: Quality gate (lint, format, types, tests at 100% coverage)
        working-directory: python
        run: |
          uv sync --locked
          uv run poe check

      - name: Build
        working-directory: python
        run: uv build

      # The schema IS the artifact: a wheel without it installs cleanly and
      # fails at first use.
      - name: Assert the shipped data files are in the wheel
        working-directory: python
        run: |
          wheel=$(ls dist/*.whl)
          for data in component-schema.json audit/open-models.json audit/serving-rates.json; do
            python -m zipfile -l "$wheel" | grep -q "dagnam_contracts/$data" \
              || { echo "::error::$data missing from $wheel"; exit 1; }
          done

      # v0.1.0 shipped broken because a module imported the `dagnam` SDK, which
      # is not a dependency -- invisible in a dev environment where the SDK was
      # already installed. A venv with ONLY the wheel is what catches that, so
      # `--no-deps` and an empty environment are the point, not caution. The check
      # runs from an empty directory: `python -c` puts the current directory first on
      # `sys.path`, so from `python/` it would import the source tree and pass without
      # the wheel; the `__file__` assertion makes that failure loud.
      - name: Install the wheel alone and validate
        working-directory: python
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet --no-deps dist/*.whl
          cd "$(mktemp -d)"
          /tmp/smoke/bin/python -c "
          import dagnam_contracts as c
          assert 'site-packages' in c.__file__, c.__file__
          assert c.COMPONENT_REGISTRY, 'schema failed to load from the wheel'
          errs = c.validate_params('convolution-layer', {'filters': -999}, node_id='n')
          assert errs, 'wheel validated an out-of-range value'
          print(f'ok: {len(c.COMPONENT_REGISTRY)} components, schema v{c.SCHEMA_VERSION}')
          "

      # `dagnam-contracts[fast]` is an alias of the default dependency, kept for the users who
      # installed it under 0.6.0: the extra must still resolve from the wheel's own metadata
      # and put the compiled core to work. The default install, on every platform and
      # interpreter, is the `install` matrix below. Run from an empty directory, for the
      # reason above, through the package; the same script under DAGNAM_CONTRACTS_PURE must
      # give the same answer on the Python.
      - name: Install the wheel with the fast alias
        working-directory: python
        run: |
          python -m venv /tmp/fast
          /tmp/fast/bin/pip install --quiet "$(ls "$PWD"/dist/*.whl)[fast]"
          cd "$(mktemp -d)"
          EXPECT_BACKEND=rust /tmp/fast/bin/python "$GITHUB_WORKSPACE/.github/scripts/check_wheel.py"
          EXPECT_BACKEND=python DAGNAM_CONTRACTS_PURE=1 /tmp/fast/bin/python "$GITHUB_WORKSPACE/.github/scripts/check_wheel.py"

  # The wheel is built once and installed everywhere below: the BUILT wheel, from a clean
  # directory, with its one dependency (`dagnam-core`) resolved from PyPI like a user's pip
  # would, never the source tree.
  wheel:
    name: Build the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Build
        working-directory: python
        run: uv build --wheel

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: python/dist/*.whl
          if-no-files-found: error

  # `dagnam-core` is a default dependency, so a plain install must work, and run the compiled
  # core, wherever the core has a native wheel: Linux x86_64 and arm64, macOS arm64 and x86_64,
  # Windows x86_64, on every CPython the package supports (the runner labels are dag-core's).
  # Where it has none (free-threaded 3.13) pip and uv take its stub wheel, `--no-build` makes
  # a build of the sdist a failure here, and the package must run on its Python.
  install:
    name: Install on ${{ matrix.runner }}, Python ${{ matrix.py }}
    needs: wheel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
        py: ["3.12", "3.13", "3.14"]
        include:
          - { runner: ubuntu-latest, py: "3.14t" }
          - { runner: ubuntu-latest, py: "3.13t", stub: "1" }
    env:
      PY: ${{ matrix.py }}
      EXPECT_STUB: ${{ matrix.stub || '0' }}
      EXPECT_BACKEND: ${{ matrix.stub == '1' && 'python' || 'rust' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          # No cache: the core must be resolved from PyPI fresh, as a user's install is.
          enable-cache: false

      - name: Install the wheel into a clean environment and use it
        run: |
          uv python install "$PY"
          uv venv --python "$PY" .venv-install
          uv pip install --python .venv-install --no-build dist/*.whl
          uv pip list --python .venv-install
          if [ "$RUNNER_OS" = Windows ]; then vpy="$PWD/.venv-install/Scripts/python.exe"; else vpy="$PWD/.venv-install/bin/python"; fi
          script="$PWD/.github/scripts/check_wheel.py"
          cd "$(mktemp -d)"
          "$vpy" "$script"
          if [ "$EXPECT_BACKEND" = rust ]; then
            EXPECT_BACKEND=python DAGNAM_CONTRACTS_PURE=1 "$vpy" "$script"
          fi

  # musl: the wheels of the core for Alpine, in an Alpine container (the image is dag-core's).
  install-musl:
    name: Install on Alpine (musl)
    needs: wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel
          path: dist/

      - name: Install the wheel in Alpine and use it
        run: |
          docker run --rm -e EXPECT_BACKEND=rust -v "$PWD/dist:/dist:ro" -v "$PWD/.github/scripts:/scripts:ro" \
            python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89 sh -euc '
            python -m venv /tmp/venv
            /tmp/venv/bin/pip install --quiet --only-binary :all: /dist/*.whl
            cd /tmp
            /tmp/venv/bin/python /scripts/check_wheel.py
            DAGNAM_CONTRACTS_PURE=1 EXPECT_BACKEND=python /tmp/venv/bin/python /scripts/check_wheel.py'

  npm:
    name: npm distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npm/package-lock.json

      # `npm run build` is `tsc && cp`, so this type-checks as well as emits.
      - name: Build
        working-directory: npm
        run: npm ci && npm run build

      # tsc --noEmit plus the vitest suite at its 100% coverage thresholds.
      - name: Quality gate (types, tests with coverage)
        working-directory: npm
        run: npm run check

      - name: Pack, install in isolation, and validate
        working-directory: npm
        run: |
          tarball="$PWD/$(npm pack --silent)"
          for data in component-schema.json open-models.json serving-rates.json; do
            tar -tzf "$tarball" | grep -q "package/dist/$data" \
              || { echo "::error::$data missing from the tarball"; exit 1; }
          done

          cd "$(mktemp -d)"
          npm init -y >/dev/null
          npm install "$tarball" >/dev/null
          cat > smoke.mjs <<'EOF'
          import {
            COMPONENT_REGISTRY,
            SCHEMA_VERSION,
            validateParamsAgainstSchema,
          } from "@dagnam/contracts";

          const n = Object.keys(COMPONENT_REGISTRY).length;
          if (!n) throw new Error("schema failed to load from the tarball");
          const errs = validateParamsAgainstSchema("convolution-layer", { filters: -999 }, "n");
          if (!errs.length) throw new Error("packed tarball validated an out-of-range value");
          console.log(`ok: ${n} components, schema v${SCHEMA_VERSION}, ${errs.length} diagnostics`);
          EOF
          node smoke.mjs

  parity-across-languages:
    name: Both interpreters agree
    needs: [python, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npm/package-lock.json

      # Two interpreters of one contract are only worth having if they say the
      # same thing. Diffing the WHOLE diagnostic -- not just the code -- is the
      # point of generating the schema instead of hand-writing two rule sets:
      # `fix_hint` and `expected` reach the user too, and drift there is just as
      # wrong and much quieter.
      #
      # Two deliberate exclusions, both verified rather than assumed:
      #   * `type` -- the two runtimes genuinely differ ("parameter_error" vs
      #     "parameter error") and that is BY DESIGN. The frontend's canonical
      #     form is the spaced one and it translates to the spec's underscored
      #     rule id itself (see client-validation.ts's `"parameter error":
      #     "parameter_error"` table). Comparing it would fail forever on a
      #     difference an adapter already handles.
      #   * keys whose value is absent -- Python emits `null`, JS omits the key.
      #     Semantically identical; only the encoding differs.
      # Each record is serialized key-sorted and compact so Python's `json` and
      # JS's `JSON.stringify` produce the same bytes for the same object.
      - name: Diff the diagnostics for one bad config
        run: |
          cd npm && npm ci >/dev/null && npm run build >/dev/null && cd ..

          python - <<'PY' > /tmp/py.txt
          import dataclasses, json, sys
          sys.path.insert(0, "python")
          from dagnam_contracts import validate_params
          errs = validate_params("convolution-layer", {"filters": -999}, node_id="n")
          rows = sorted(
              json.dumps(
                  {k: v for k, v in dataclasses.asdict(e).items() if k != "type" and v is not None},
                  sort_keys=True,
                  separators=(",", ":"),
              )
              for e in errs
          )
          print(json.dumps(rows, indent=2))
          PY

          node --input-type=module <<'JS' > /tmp/js.txt
          import { validateParamsAgainstSchema } from "./npm/dist/index.js";
          const errs = validateParamsAgainstSchema("convolution-layer", { filters: -999 }, "n");
          const rows = errs
            .map((e) =>
              JSON.stringify(
                Object.fromEntries(
                  Object.entries(e)
                    .filter(([k, v]) => k !== "type" && v !== null && v !== undefined)
                    .sort(),
                ),
              ),
            )
            .sort();
          console.log(JSON.stringify(rows, null, 2));
          JS

          diff /tmp/py.txt /tmp/js.txt \
            || { echo "::error::the Python and TypeScript interpreters disagree"; exit 1; }
          cat /tmp/py.txt
