[project]
name = "dagnam-contracts"
version = "0.7.0"
description = "Canonical component/parameter validation contract for Dagnam.AI — schema plus a dependency-free interpreter."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Dagnam.AI" }]
keywords = ["dagnam", "validation", "contract", "schema"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# One dependency, by design: the compiled core (`dagnam-core`) runs the hygiene hot paths.
# `dagnam` ships with `requests` and `numpy` only, so this is the one thing the contract
# adds, and it is a wheel on every platform: where there is no native wheel (free-threaded
# 3.13, PyPy, Windows on arm64, ...) the core's own stub wheel installs, reports the core
# unavailable, and the Python in this package runs. No environment marker is needed, and
# none is allowed (`tests/test_packaging.py`).
# An exact pin, because the contract must match the core's behaviour exactly: a core release
# can change a result without changing its binding contract, so every core release is a
# release of this package. The Pydantic registry stays in `registry/` as an authoring format
# and is never packaged.
dependencies = ["dagnam-core==0.2.0"]

[project.optional-dependencies]
# Kept as an alias of the default so `dagnam-contracts[fast]`, which 0.6.0 documented, keeps
# installing. The same pin; nothing more.
fast = ["dagnam-core==0.2.0"]

[project.urls]
Homepage = "https://github.com/Dagnam-AI/dag-contracts"
Source = "https://github.com/Dagnam-AI/dag-contracts"

[dependency-groups]
dev = [
    "dagnam-core==0.2.0",
    "hypothesis",
    "poethepoet>=0.46.0",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
# hatchling 1.32 (2026-08-11) made core metadata 2.5 the default, which the
# publish action's twine still rejects ("'2.5' is not a valid metadata
# version") -- the 0.2.0 release died on that check. Held below 1.32 (2.4)
# until pypa/gh-action-pypi-publish ships a twine that accepts 2.5.
requires = ["hatchling>=1.27,<1.34"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dagnam_contracts"]

# The generated schema IS the artifact — without it the interpreter has nothing
# to interpret, so it must be in the wheel, not merely in the repo.
[tool.hatch.build.targets.wheel.force-include]
"dagnam_contracts/component-schema.json" = "dagnam_contracts/component-schema.json"
# PEP 561 marker. Without it a type checker IGNORES this package's inline
# annotations entirely, no matter that every function is annotated -- so the
# "Typing :: Typed" classifier above was a claim the wheel did not back up, and
# consumers got "Stub file not found" warnings for a fully typed dependency.
"dagnam_contracts/py.typed" = "dagnam_contracts/py.typed"
# The open-model reference rows the audit report compares against. Loaded via
# importlib.resources, so like the schema it is the artifact, not a repo file:
# without it in the wheel `load_reference_models()` raises at import time.
"dagnam_contracts/audit/open-models.json" = "dagnam_contracts/audit/open-models.json"
# Same rule for the serving rate card: `load_serving_rates()` reads it through
# importlib.resources, and the npm package ships the identical bytes so the
# Studio and the wheel price the same audit the same way.
"dagnam_contracts/audit/serving-rates.json" = "dagnam_contracts/audit/serving-rates.json"

# The sdist is the source tree minus what .gitignore names, and local tool state
# (Hypothesis's example database, the pytest and ruff caches, coverage output) is not
# all ignored: none of it belongs in a published archive.
[tool.hatch.build.targets.sdist]
exclude = [
    ".hypothesis",
    ".pytest_cache",
    ".ruff_cache",
    ".coverage",
    "htmlcov",
    "coverage.json",
    "coverage.xml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["dagnam_contracts"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Hard gate: the suite must keep dagnam_contracts at 100% statement AND branch
# coverage (branch = true above folds branch coverage into the total % that
# fail_under checks). Any regression fails `uv run poe check`.
fail_under = 100

[tool.poe.tasks]
test = { cmd = "pytest tests -q --cov=dagnam_contracts --cov-branch --cov-report=term-missing", help = "Run the test suite with branch coverage (fails under 100%)" }
test-cov = { cmd = "pytest tests -q --cov=dagnam_contracts --cov-branch --cov-report=term-missing --cov-report=html:htmlcov --cov-report=json:coverage.json", help = "Run tests and generate terminal, HTML, and JSON coverage reports" }
lint = { cmd = "ruff check dagnam_contracts tests", help = "Lint" }
format-check = { cmd = "ruff format --check dagnam_contracts tests", help = "Check formatting" }
typecheck = { cmd = "pyright dagnam_contracts tests", help = "Type-check (strict)" }
# The same suite on the Python reference: the compiled backend is off, so the code the
# dispatch bypasses is measured too. Each of the two runs holds 100%.
test-pure = { cmd = "pytest tests -q --cov=dagnam_contracts --cov-branch --cov-report=term-missing", env = { DAGNAM_CONTRACTS_PURE = "1" }, help = "Run the suite on the pure Python backend (fails under 100%)" }
check = { sequence = ["lint", "format-check", "typecheck", "test", "test-pure"], help = "Run every quality gate, on both backends" }


[tool.ruff]
# 100, matching the sibling SDK. Without this ruff defaults to 88 and would
# rewrap source that was authored to the workspace's width.
line-length = 100
target-version = "py312"
src = ["dagnam_contracts", "tests"]

[tool.ruff.lint.isort]
# Matching the sibling SDK, so the two public packages sort imports the same
# way. Without force-sort-within-sections ruff reorders existing source purely
# on `import x` vs `from x import y`, which is churn, not a fix.
known-first-party = ["dagnam_contracts"]
combine-as-imports = true
force-sort-within-sections = true

[tool.pyright]
include = ["dagnam_contracts", "tests"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportMissingImports = "error"
reportUnusedImport = "error"

# Strict mode minus its "completeness" family, matching the sibling SDK. This
# package's whole subject matter is dynamic JSON -- `JsonValue` is a recursive
# union and every fixture is a dict literal -- so reportUnknown*/reportMissing*
# fire on essentially every line and can only be silenced by casting at each
# boundary, which buys nothing. Every *bug-catching* strict diagnostic
# (reportArgumentType, reportCallIssue, reportIndexIssue, reportOptional*,
# reportReturnType, reportAttributeAccessIssue, ...) stays on -- those are the
# ones that caught the 119 real type errors in the first test pass.
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportMissingTypeStubs = "warning"

# Tests reach into private (`_`-prefixed) helpers to assert on internal
# behaviour directly -- that is what a unit test is for, not a design smell.
# Scoped to the tests root so production type checking keeps the rule.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"
