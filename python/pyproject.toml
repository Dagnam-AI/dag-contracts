[project]
name = "dagnam-contracts"
version = "0.2.0"
description = "Canonical component/parameter validation contract for Dagnam.AI — schema plus a dependency-free interpreter."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Dagnam.AI" }]
keywords = ["dagnam", "validation", "contract", "schema"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# INTENTIONALLY EMPTY, and a design constraint rather than an accident: the
# `dagnam` SDK ships with only `requests` and `numpy`, so a contract package it
# depends on must add nothing. This is exactly why the Pydantic registry stays
# in `registry/` as an authoring format and is never packaged — the wheel
# carries generated JSON and a plain-Python interpreter of it.
dependencies = []

[project.urls]
Homepage = "https://github.com/Dagnam-AI/dag-contracts"
Source = "https://github.com/Dagnam-AI/dag-contracts"

[dependency-groups]
dev = [
    "hypothesis",
    "poethepoet>=0.46.0",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dagnam_contracts"]

# The generated schema IS the artifact — without it the interpreter has nothing
# to interpret, so it must be in the wheel, not merely in the repo.
[tool.hatch.build.targets.wheel.force-include]
"dagnam_contracts/component-schema.json" = "dagnam_contracts/component-schema.json"
# PEP 561 marker. Without it a type checker IGNORES this package's inline
# annotations entirely, no matter that every function is annotated -- so the
# "Typing :: Typed" classifier above was a claim the wheel did not back up, and
# consumers got "Stub file not found" warnings for a fully typed dependency.
"dagnam_contracts/py.typed" = "dagnam_contracts/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["dagnam_contracts"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Hard gate: the suite must keep dagnam_contracts at 100% statement AND branch
# coverage (branch = true above folds branch coverage into the total % that
# fail_under checks). Any regression fails `uv run poe check`.
fail_under = 100

[tool.poe.tasks]
test = { cmd = "pytest tests -q --cov=dagnam_contracts --cov-branch --cov-report=term-missing", help = "Run the test suite with branch coverage (fails under 100%)" }
test-cov = { cmd = "pytest tests -q --cov=dagnam_contracts --cov-branch --cov-report=term-missing --cov-report=html:htmlcov --cov-report=json:coverage.json", help = "Run tests and generate terminal, HTML, and JSON coverage reports" }
lint = { cmd = "ruff check dagnam_contracts tests", help = "Lint" }
format-check = { cmd = "ruff format --check dagnam_contracts tests", help = "Check formatting" }
typecheck = { cmd = "pyright dagnam_contracts tests", help = "Type-check (strict)" }
check = { sequence = ["lint", "format-check", "typecheck", "test"], help = "Run every quality gate" }


[tool.ruff]
# 100, matching the sibling SDK. Without this ruff defaults to 88 and would
# rewrap source that was authored to the workspace's width.
line-length = 100
target-version = "py312"
src = ["dagnam_contracts", "tests"]

[tool.ruff.lint.isort]
# Matching the sibling SDK, so the two public packages sort imports the same
# way. Without force-sort-within-sections ruff reorders existing source purely
# on `import x` vs `from x import y`, which is churn, not a fix.
known-first-party = ["dagnam_contracts"]
combine-as-imports = true
force-sort-within-sections = true

[tool.pyright]
include = ["dagnam_contracts", "tests"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportMissingImports = "error"
reportUnusedImport = "error"

# Strict mode minus its "completeness" family, matching the sibling SDK. This
# package's whole subject matter is dynamic JSON -- `JsonValue` is a recursive
# union and every fixture is a dict literal -- so reportUnknown*/reportMissing*
# fire on essentially every line and can only be silenced by casting at each
# boundary, which buys nothing. Every *bug-catching* strict diagnostic
# (reportArgumentType, reportCallIssue, reportIndexIssue, reportOptional*,
# reportReturnType, reportAttributeAccessIssue, ...) stays on -- those are the
# ones that caught the 119 real type errors in the first test pass.
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportMissingTypeStubs = "warning"

# Tests reach into private (`_`-prefixed) helpers to assert on internal
# behaviour directly -- that is what a unit test is for, not a design smell.
# Scoped to the tests root so production type checking keeps the rule.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"
