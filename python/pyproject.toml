[project]
name = "dagnam-contracts"
version = "0.1.0"
description = "Canonical component/parameter validation contract for Dagnam.AI — schema plus a dependency-free interpreter."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Dagnam.AI" }]
keywords = ["dagnam", "validation", "contract", "schema"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# INTENTIONALLY EMPTY, and a design constraint rather than an accident: the
# `dagnam` SDK ships with only `requests` and `numpy`, so a contract package it
# depends on must add nothing. This is exactly why the Pydantic registry stays
# in `registry/` as an authoring format and is never packaged — the wheel
# carries generated JSON and a plain-Python interpreter of it.
dependencies = []

[project.urls]
Homepage = "https://github.com/Dagnam-AI/dag-contracts"
Source = "https://github.com/Dagnam-AI/dag-contracts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dagnam_contracts"]

# The generated schema IS the artifact — without it the interpreter has nothing
# to interpret, so it must be in the wheel, not merely in the repo.
[tool.hatch.build.targets.wheel.force-include]
"dagnam_contracts/component-schema.json" = "dagnam_contracts/component-schema.json"
